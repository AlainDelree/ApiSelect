<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <title>Résultats de sélection — ApiSelect</title>
    <style>
        body { font-family: sans-serif; margin: 2em; color: #222; }
        h1 { margin-bottom: 0.2em; }
        .lien-retour { margin-bottom: 1.5em; display: inline-block; }
        .tableau-resultats-compact { font-size: 1em; }
        .actions-fiches { margin: 1.5em 0; }
        .actions-fiches a { margin-right: 1.5em; }
    </style>
</head>
<body>
    {% include "selection/_bandeau_test.html" %}
    <p class="lien-retour"><a href="{% url 'admin:index' %}">&larr; Retour à l'administration</a></p>
    <h1>Résultats de sélection</h1>

    {% include "selection/_tableau_resultats.html" %}

    {% if campagne_selectionnee %}
        <p class="actions-fiches">
            <a href="{% url 'selection:fiche_rapide' %}?campagne={{ campagne_selectionnee.id }}">Fiche de terrain rapide (PDF)</a>
            <a href="{% url 'selection:fiche_approfondie_formulaire' %}?campagne={{ campagne_selectionnee.id }}">Fiche de terrain approfondie (PDF)</a>
        </p>
    {% endif %}
</body>
</html>
